name: Build Docker image (verify only)

# Builds the Docker image on every push to verify the Dockerfile + .NET + Angular
# build still works. Does NOT push to any registry — actual deployment is a
# source-build on mini-speedy (see DEPLOY.md). Keeping CI lets us catch rot
# (Debian archive issues, Node tarball moves, etc.) before they bite a real
# rebuild on the host.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          file: Dockerfile
          tags: teslacamviewer:ci
